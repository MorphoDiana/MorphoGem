name: Build & Publish MorphoGem Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            tripo_mcp/package-lock.json
            desktop/package-lock.json

      - name: Install Tripo MCP dependencies
        working-directory: tripo_mcp
        run: npm ci

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run core MCP & clean-room verification tests
        run: node tripo_mcp/test-smoke.mjs

      - name: Build Windows NSIS Setup Installer Locally
        working-directory: desktop
        run: npx electron-builder --win nsis --publish never

      - name: Prepare Clean Installer Files
        shell: pwsh
        run: |
          Remove-Item "desktop/dist/*__uninstaller*" -Force -ErrorAction SilentlyContinue
          Get-ChildItem "desktop/dist" -File | Format-Table Name, Length -AutoSize

      - name: Publish GitHub Release (.exe + .blockmap + latest.yml)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MorphoGem ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: 'true'
          fail_on_unmatched_files: true
          body: |
            ## MorphoGem ${{ github.ref_name }} (MIT Open-Source Release)

            - **Windows 安装程序 / Windows Setup**: 下载下方 **`MorphoGem-Setup-*.exe`** 双击即可安装（支持自由选择安装目录；升级或卸载时自动保留 `Projects`、`Exports`、`Mods` 与 `userdata` 数据目录）。
            - **增量更新索引 / Auto-Update Metadata**: `latest.yml` 与 `.blockmap` 供已安装客户端内置在线更新器使用，普通用户只需下载 `.exe` 安装包。
          files: |
            desktop/dist/MorphoGem-Setup-*.exe
            desktop/dist/MorphoGem-Setup-*.exe.blockmap
            desktop/dist/latest.yml

      - name: Upload Build Artifacts Backup
        uses: actions/upload-artifact@v4
        with:
          name: MorphoGem-Windows-Setup
          path: |
            desktop/dist/MorphoGem-Setup-*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
